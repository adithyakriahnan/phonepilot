<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePilot - Smart Phone Recommendations & Comparison</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --badge-bg: #312e81;
            --badge-text: #a5b4fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0 30px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .panel h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .range-val {
            text-align: right;
            font-weight: bold;
            color: var(--badge-text);
            font-size: 0.9rem;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .catalog-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .catalog-controls input {
            flex: 2;
            min-width: 200px;
        }

        .catalog-controls select {
            flex: 1;
            min-width: 160px;
        }

        .phone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .phone-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .phone-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .match-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--accent);
        }

        .phone-card h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            padding-right: 60px;
        }

        .brand-tag {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .release-date-tag {
            font-size: 0.85rem;
            color: var(--badge-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .specs-list {
            list-style: none;
            margin: 15px 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .specs-list li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .price-tag {
            font-size: 1.3rem;
            font-weight: bold;
            color: #10b981;
            margin: 10px 0;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn.selected {
            background-color: #10b981;
        }

        /* Comparison Drawer/Section */
        .compare-section {
            margin-top: 40px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .compare-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .compare-table-wrapper {
            overflow-x: auto;
        }

        table.compare-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        table.compare-table th, table.compare-table td {
            padding: 12px 15px;
            border: 1px solid var(--border);
        }

        table.compare-table th {
            background-color: var(--bg-color);
            color: var(--badge-text);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>✈️ PhonePilot</h1>
        <p>Find your ideal smartphone match with customized filters and side-by-side specs comparison.</p>
    </header>

    <div class="main-layout">
        <aside class="panel">
            <h2>Recommendation Engine</h2>
            
            <div class="form-group">
                <label for="budget">Max Budget ($)</label>
                <input type="range" id="budget" min="100" max="2000" step="50" value="2000">
                <div class="range-val" id="budget-val">$2000</div>
            </div>

            <div class="form-group">
                <label for="brand-filter">Brand Filter</label>
                <select id="brand-filter">
                    <option value="All">All Brands</option>
                    <option value="OPPO">OPPO</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="Realme">Realme</option>
                    <option value="Tecno">Tecno</option>
                    <option value="Nothing">Nothing</option>
                </select>
            </div>

            <hr style="border-color: var(--border); margin: 20px 0;">

            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Priorities (Weights)</p>

            <div class="form-group">
                <label for="p-camera">Camera Priority</label>
                <input type="range" id="p-camera" min="0" max="10" value="5">
            </div>

            <div class="form-group">
                <label for="p-gaming">Gaming & Speed Priority</label>
                <input type="range" id="p-gaming" min="0" max="10" value="5">
            </div>

            <div class="form-group">
                <label for="p-battery">Battery Life Priority</label>
                <input type="range" id="p-battery" min="0" max="10" value="5">
            </div>

            <div class="form-group">
                <label for="p-display">Display Priority</label>
                <input type="range" id="p-display" min="0" max="10" value="5">
            </div>
        </aside>

        <main>
            <div class="catalog-controls">
                <input type="text" id="search-input" placeholder="Search phone name, specs...">
                <select id="sort-select">
                    <option value="recommended">Recommended</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="price-asc">Price: Low → High</option>
                    <option value="price-desc">Price: High → Low</option>
                    <option value="name-asc">Name: A → Z</option>
                </select>
            </div>

            <div class="phone-grid" id="phone-grid">
                </div>
        </main>
    </div>

    <section class="compare-section" id="compare-section">
        <div class="compare-header">
            <h2>Phone Comparison (<span id="compare-count">0</span>/4)</h2>
            <button class="btn" style="width: auto; padding: 6px 15px; background-color: #ef4444;" onclick="clearComparison()">Clear All</button>
        </div>
        <div class="compare-table-wrapper" id="compare-table-wrapper">
            <p style="color: var(--text-muted);">Select up to 4 phones from the catalog above to compare specs side-by-side.</p>
        </div>
    </section>

    <script>
        const phoneDatabase = [
            // OPPO Models Mandatory Collection
            { name: "OPPO Find X9 Ultra", brand: "OPPO", price: 1200, releaseDate: "Upcoming", camera: 10, gaming: 10, battery: 9, display: 10, chip: "Snapdragon 8 Gen 4", batteryCap: "5500 mAh" },
            { name: "OPPO Find X7 Pro Ultra", brand: "OPPO", price: 1100, releaseDate: "January 2024", camera: 10, gaming: 9, battery: 8, display: 10, chip: "Snapdragon 8 Gen 3", batteryCap: "5000 mAh" },
            { name: "OPPO Find N3 Flip", brand: "OPPO", price: 999, releaseDate: "October 2023", camera: 8, gaming: 8, battery: 7, display: 9, chip: "Dimensity 9200", batteryCap: "4300 mAh" },
            { name: "OPPO Reno16 Pro 5G", brand: "OPPO", price: 650, releaseDate: "Upcoming", camera: 9, gaming: 8, battery: 9, display: 9, chip: "Dimensity 8400", batteryCap: "5500 mAh" },
            { name: "OPPO Reno 16c", brand: "OPPO", price: 350, releaseDate: "Expected: October 2026", camera: 7, gaming: 7, battery: 8, display: 7, chip: "Dimensity 7050", batteryCap: "5000 mAh" },
            { name: "OPPO Reno 14", brand: "OPPO", price: 480, releaseDate: "May 2025", camera: 8, gaming: 8, battery: 8, display: 8, chip: "Dimensity 8300", batteryCap: "5000 mAh" },
            { name: "OPPO Reno 13F 5G", brand: "OPPO", price: 320, releaseDate: "January 2025", camera: 7, gaming: 6, battery: 8, display: 8, chip: "Snapdragon 6 Gen 1", batteryCap: "5000 mAh" },
            { name: "OPPO K15 Pro", brand: "OPPO", price: 400, releaseDate: "Upcoming", camera: 8, gaming: 9, battery: 9, display: 8, chip: "Snapdragon 8s Gen 3", batteryCap: "5500 mAh" },
            { name: "OPPO K14x 5G", brand: "OPPO", price: 220, releaseDate: "Expected: November 2026", camera: 6, gaming: 6, battery: 9, display: 7, chip: "Dimensity 6100+", batteryCap: "5000 mAh" },
            { name: "OPPO K13 Turbo Pro", brand: "OPPO", price: 380, releaseDate: "August 2025", camera: 8, gaming: 9, battery: 9, display: 9, chip: "Snapdragon 8s Gen 4", batteryCap: "6000 mAh" },
            { name: "OPPO K13 5G", brand: "OPPO", price: 250, releaseDate: "April 2025", camera: 7, gaming: 7, battery: 10, display: 8, chip: "Snapdragon 6 Gen 4", batteryCap: "7000 mAh" },
            { name: "OPPO K13x 5G", brand: "OPPO", price: 180, releaseDate: "June 2025", camera: 6, gaming: 6, battery: 9, display: 7, chip: "Dimensity 6300", batteryCap: "5100 mAh" },
            { name: "OPPO A6s 5G", brand: "OPPO", price: 210, releaseDate: "Expected: December 2026", camera: 6, gaming: 6, battery: 9, display: 7, chip: "Snapdragon 4 Gen 2", batteryCap: "5000 mAh" },
            { name: "OPPO A3 Pro 5G", brand: "OPPO", price: 240, releaseDate: "April 2024", camera: 6, gaming: 6, battery: 9, display: 7, chip: "Dimensity 7050", batteryCap: "5000 mAh" },

            // Existing Models Retained
            { name: "Xiaomi 14 Civi", brand: "Xiaomi", price: 520, releaseDate: "June 2024", camera: 9, gaming: 9, battery: 7, display: 9, chip: "Snapdragon 8s Gen 3", batteryCap: "4700 mAh" },
            { name: "Realme GT 7", brand: "Realme", price: 650, releaseDate: "May 2025", camera: 8, gaming: 10, battery: 10, display: 9, chip: "Dimensity 9400e", batteryCap: "7000 mAh" },
            { name: "Tecno Pova 6 Pro 5G", brand: "Tecno", price: 230, releaseDate: "March 2024", camera: 6, gaming: 7, battery: 9, display: 8, chip: "Dimensity 6080", batteryCap: "6000 mAh" },
            { name: "Nothing Phone (2)", brand: "Nothing", price: 599, releaseDate: "July 2023", camera: 8, gaming: 8, battery: 8, display: 9, chip: "Snapdragon 8+ Gen 1", batteryCap: "4700 mAh" }
        ];

        let selectedForCompare = [];

        // DOM Handles
        const budgetInput = document.getElementById('budget');
        const budgetVal = document.getElementById('budget-val');
        const brandFilter = document.getElementById('brand-filter');
        const pCamera = document.getElementById('p-camera');
        const pGaming = document.getElementById('p-gaming');
        const pBattery = document.getElementById('p-battery');
        const pDisplay = document.getElementById('p-display');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const phoneGrid = document.getElementById('phone-grid');

        // Helper: Convert date strings to timestamps for strict ordering
        function parseReleaseDate(dateStr) {
            if (dateStr.startsWith("Upcoming")) return 9999999999999;
            if (dateStr.startsWith("Expected:")) {
                const cleaned = dateStr.replace("Expected:", "").trim();
                return new Date(cleaned).getTime() || 8888888888888;
            }
            return new Date(dateStr).getTime() || 0;
        }

        function calculateMatchScore(phone) {
            const wCam = parseInt(pCamera.value);
            const wGam = parseInt(pGaming.value);
            const wBat = parseInt(pBattery.value);
            const wDis = parseInt(pDisplay.value);

            const maxScore = (wCam + wGam + wBat + wDis) * 10;
            if (maxScore === 0) return 100;

            const actualScore = (phone.camera * wCam) + (phone.gaming * wGam) + (phone.battery * wBat) + (phone.display * wDis);
            return Math.round((actualScore / maxScore) * 100);
        }

        function renderCatalog() {
            const maxBudget = parseInt(budgetInput.value);
            const selectedBrand = brandFilter.value;
            const searchTerm = searchInput.value.toLowerCase().trim();
            const sortMode = sortSelect.value;

            // 1. Filter
            let filtered = phoneDatabase.filter(phone => {
                const matchesBudget = phone.price <= maxBudget;
                const matchesBrand = selectedBrand === "All" || phone.brand === selectedBrand;
                const matchesSearch = phone.name.toLowerCase().includes(searchTerm) || 
                                      phone.chip.toLowerCase().includes(searchTerm) ||
                                      phone.brand.toLowerCase().includes(searchTerm);
                return matchesBudget && matchesBrand && matchesSearch;
            });

            // 2. Map Match Scores
            filtered = filtered.map(phone => ({
                ...phone,
                matchScore: calculateMatchScore(phone)
            }));

            // 3. Sort
            filtered.sort((a, b) => {
                if (sortMode === "recommended") return b.matchScore - a.matchScore;
                if (sortMode === "price-asc") return a.price - b.price;
                if (sortMode === "price-desc") return b.price - a.price;
                if (sortMode === "name-asc") return a.name.localeCompare(b.name);
                if (sortMode === "newest") return parseReleaseDate(b.releaseDate) - parseReleaseDate(a.releaseDate);
                if (sortMode === "oldest") return parseReleaseDate(a.releaseDate) - parseReleaseDate(b.releaseDate);
                return 0;
            });

            // 4. Render
            phoneGrid.innerHTML = "";
            if (filtered.length === 0) {
                phoneGrid.innerHTML = `<div class="no-results">No smartphones match your exact search and filter criteria.</div>`;
                return;
            }

            filtered.forEach(phone => {
                const isSelected = selectedForCompare.some(p => p.name === phone.name);
                const card = document.createElement('div');
                card.className = "phone-card";
                card.innerHTML = `
                    <span class="match-badge">${phone.matchScore}% Match</span>
                    <div>
                        <div class="brand-tag">${phone.brand}</div>
                        <h3>${phone.name}</h3>
                        <div class="release-date-tag">📅 Released: ${phone.releaseDate}</div>
                        <div class="price-tag">$${phone.price}</div>
                        <ul class="specs-list">
                            <li><span>Chipset:</span> <strong>${phone.chip}</strong></li>
                            <li><span>Battery:</span> <strong>${phone.batteryCap}</strong></li>
                            <li><span>Camera Score:</span> <strong>${phone.camera}/10</strong></li>
                            <li><span>Gaming Score:</span> <strong>${phone.gaming}/10</strong></li>
                        </ul>
                    </div>
                    <button class="btn ${isSelected ? 'selected' : ''}" onclick="toggleCompare('${phone.name}')">
                        ${isSelected ? '✓ Added to Compare' : '+ Compare'}
                    </button>
                `;
                phoneGrid.appendChild(card);
            });
        }

        function toggleCompare(phoneName) {
            const index = selectedForCompare.findIndex(p => p.name === phoneName);
            if (index > -1) {
                selectedForCompare.splice(index, 1);
            } else {
                if (selectedForCompare.length >= 4) {
                    alert("You can compare up to 4 phones maximum.");
                    return;
                }
                const phone = phoneDatabase.find(p => p.name === phoneName);
                if (phone) selectedForCompare.push(phone);
            }
            renderCatalog();
            renderComparison();
        }

        function clearComparison() {
            selectedForCompare = [];
            renderCatalog();
            renderComparison();
        }

        function renderComparison() {
            const wrapper = document.getElementById('compare-table-wrapper');
            document.getElementById('compare-count').innerText = selectedForCompare.length;

            if (selectedForCompare.length === 0) {
                wrapper.innerHTML = `<p style="color: var(--text-muted);">Select up to 4 phones from the catalog above to compare specs side-by-side.</p>`;
                return;
            }

            let tableHTML = `<table class="compare-table"><thead><tr><th>Specification</th>`;
            selectedForCompare.forEach(p => {
                tableHTML += `<th>${p.name}</th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            const rows = [
                { label: "Brand", key: "brand" },
                { label: "Price", key: "price", format: v => `$${v}` },
                { label: "Release Date", key: "releaseDate" },
                { label: "Chipset", key: "chip" },
                { label: "Battery Capacity", key: "batteryCap" },
                { label: "Camera Rating", key: "camera", format: v => `${v}/10` },
                { label: "Gaming Rating", key: "gaming", format: v => `${v}/10` },
                { label: "Display Rating", key: "display", format: v => `${v}/10` }
            ];

            rows.forEach(row => {
                tableHTML += `<tr><strong><td>${row.label}</td></strong>`;
                selectedForCompare.forEach(p => {
                    const val = row.format ? row.format(p[row.key]) : p[row.key];
                    tableHTML += `<td>${val}</td>`;
                });
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table>`;
            wrapper.innerHTML = tableHTML;
        }

        // Event Listeners
        budgetInput.addEventListener('input', (e) => {
            budgetVal.innerText = `$${e.target.value}`;
            renderCatalog();
        });

        [brandFilter, pCamera, pGaming, pBattery, pDisplay, searchInput, sortSelect].forEach(element => {
            element.addEventListener('input', renderCatalog);
        });

        // Initialize App
        renderCatalog();
    </script>
</body>
</html>
