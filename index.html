<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePilot AI - Smart Mobile Recommendation & Comparison Engine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --primary: #3b82f6;
      --primary-accent: #60a5fa;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-accent);
    }

    .logo i {
      font-size: 1.75rem;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .badge {
      background: var(--accent);
      color: #000;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 1rem;
    }

    main {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Controls & Sliders Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .filter-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      height: fit-content;
    }

    .filter-group {
      margin-bottom: 1.5rem;
    }

    .filter-group label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .filter-group input[type="range"] {
      width: 100%;
      accent-color: var(--primary-accent);
    }

    .filter-group select, .search-input, .sort-select {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 0.5rem;
      outline: none;
    }

    .reset-btn {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    /* Phone Cards Grid */
    .phones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .phone-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .phone-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-accent);
    }

    .suitability-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--accent);
      color: #052e16;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 2rem;
      font-size: 0.85rem;
    }

    .phone-brand {
      color: var(--primary-accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .phone-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0.25rem 0 0.25rem 0;
      padding-right: 3rem;
    }

    .release-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .release-badge.upcoming {
      color: var(--warning);
    }

    .phone-price {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .specs-list {
      list-style: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .specs-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .specs-list i {
      width: 16px;
      color: var(--primary-accent);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-action:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-action.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Comparison Table Styling */
    .comparison-container {
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .comparison-table th, .comparison-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      min-width: 200px;
    }

    .comparison-table th {
      color: var(--primary-accent);
      font-size: 1rem;
    }

    .comparison-table td:first-child, .comparison-table th:first-child {
      position: sticky;
      left: 0;
      background: var(--bg-card);
      z-index: 10;
      font-weight: 700;
      min-width: 150px;
      border-right: 1px solid var(--border-color);
    }

    /* Views visibility */
    .view-container {
      display: none;
    }
    .view-container.active {
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>PhonePilot <span style="color:var(--accent); font-size: 0.8rem; vertical-align: super;">AI</span></span>
      </div>
      <nav>
        <button class="nav-btn active" onclick="switchTab('recommendations')">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Recommendation Engine
        </button>
        <button class="nav-btn" onclick="switchTab('catalog')">
          <i class="fa-solid fa-list-ul"></i> Catalog
        </button>
        <button class="nav-btn" onclick="switchTab('compare')">
          <i class="fa-solid fa-code-compare"></i> Compare <span class="badge" id="compare-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div id="recommendations-view" class="view-container active">
      <div class="dashboard-grid">
        <div class="filter-panel">
          <h3 style="margin-bottom: 1rem; font-size: 1.1rem;"><i class="fa-solid fa-sliders"></i> User Preference Profile</h3>
          
          <div class="filter-group">
            <label>Max Budget: <span id="budget-val">₹2,00,000</span></label>
            <input type="range" id="budget-slider" min="5000" max="250000" step="2500" value="200000" oninput="updateFilters()">
          </div>

          <div class="filter-group">
            <label>Brand Filter</label>
            <select id="brand-select" onchange="updateFilters()">
              <option value="ALL">All Brands</option>
              <option value="Samsung">Samsung</option>
              <option value="Apple">Apple</option>
              <option value="Xiaomi">Xiaomi / Redmi</option>
              <option value="POCO">POCO</option>
              <option value="OnePlus">OnePlus</option>
              <option value="Vivo">Vivo</option>
              <option value="iQOO">iQOO</option>
              <option value="OPPO">OPPO</option>
              <option value="Realme">Realme</option>
              <option value="Motorola">Motorola</option>
              <option value="Google">Google</option>
              <option value="Nothing">Nothing / CMF</option>
              <option value="Tecno">Tecno</option>
              <option value="Infinix">Infinix</option>
              <option value="Lava">Lava</option>
              <option value="Itel">Itel</option>
            </select>
          </div>

          <hr style="border-color: var(--border-color); margin: 1rem 0;">

          <h4 style="margin-bottom: 1rem; font-size: 0.95rem; color: var(--primary-accent);">Feature Priorities (1-10)</h4>

          <div class="filter-group">
            <label>Camera Quality: <span id="weight-cam-val">5</span></label>
            <input type="range" id="weight-cam" min="1" max="10" value="5" oninput="updateFilters()">
          </div>

          <div class="filter-group">
            <label>Gaming & Speed: <span id="weight-perf-val">5</span></label>
            <input type="range" id="weight-perf" min="1" max="10" value="5" oninput="updateFilters()">
          </div>

          <div class="filter-group">
            <label>Battery Life: <span id="weight-bat-val">5</span></label>
            <input type="range" id="weight-bat" min="1" max="10" value="5" oninput="updateFilters()">
          </div>

          <div class="filter-group">
            <label>Display Quality: <span id="weight-disp-val">5</span></label>
            <input type="range" id="weight-disp" min="1" max="10" value="5" oninput="updateFilters()">
          </div>

          <button class="reset-btn" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> Reset Profile</button>
        </div>

        <div>
          <div class="section-title">
            <i class="fa-solid fa-bullseye" style="color: var(--accent);"></i>
            <span>Top Matched Smartphones</span>
          </div>
          <div class="phones-grid" id="recommendations-grid"></div>
        </div>
      </div>
    </div>

    <div id="catalog-view" class="view-container">
      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <input type="text" class="search-input" id="search-bar" placeholder="Search by model, chip, or brand..." style="flex: 2; min-width: 250px;" oninput="renderCatalog()">
        <select class="sort-select" id="sort-select" style="flex: 1; min-width: 200px;" onchange="renderCatalog()">
          <option value="recommended">Recommended</option>
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="name-asc">Name: A → Z</option>
        </select>
      </div>
      <div class="phones-grid" id="catalog-grid"></div>
    </div>

    <div id="compare-view" class="view-container">
      <div class="section-title">
        <i class="fa-solid fa-code-compare" style="color: var(--primary-accent);"></i>
        <span>Side-by-Side Comparison</span>
      </div>
      <div id="compare-content"></div>
    </div>
  </main>

      if (!dateStr || dateStr === "Upcoming") return 9999999999999;
      if (dateStr.startsWith("Expected:")) {
        const parts = dateStr.replace("Expected:", "").trim().split(" ");
        if (parts.length === 2) {
          return new Date(`${parts[0]} 1, ${parts[1]}`).getTime() || 9999999999998;
        }
        return 9999999999998;

      return new Date(`${dateStr} 1`).getTime() || 0;

      { id: "inf-gt50p", brand: "Infinix", name: "Infinix GT 50 Pro", price: 24999, releaseDate: "Upcoming", processor: "MediaTek Dimensity 8300", display: '6.78" FHD+ 144Hz AMOLED', camera: "108MP OIS + 8MP UW", battery: "5500 mAh", scores: { cam: 7, perf: 8, bat: 9, disp: 9 } },
      { id: "inf-n60p", brand: "Infinix", name: "Infinix Note 60 Pro Pininfarina Limited Edition", price: 22999, releaseDate: "Upcoming", processor: "MediaTek Dimensity 7300", display: '6.78" 3D Curved AMOLED 120Hz', camera: "108MP OIS + 2MP Macro", battery: "5000 mAh", scores: { cam: 7, perf: 7, bat: 8, disp: 8 } },
      { id: "inf-h70p", brand: "Infinix", name: "Infinix Hot 70 Pro 5G", price: 14999, releaseDate: "Upcoming", processor: "MediaTek Dimensity 6300", display: '6.78" FHD+ 120Hz LCD', camera: "50MP Main Camera", battery: "5000 mAh", scores: { cam: 5, perf: 6, bat: 8, disp: 6 } },

      // LAVA
      { id: "lav-a3", brand: "Lava", name: "Lava Agni 3 5G", price: 20999, releaseDate: "October 2024", processor: "MediaTek Dimensity 7300X", display: '6.78" 1.5K Curved AMOLED 120Hz + Rear Display', camera: "50MP OIS + 8MP UW + 8MP Telephoto", battery: "5000 mAh", scores: { cam: 7, perf: 7, bat: 8, disp: 9 } },
      { id: "lav-bp", brand: "Lava", name: "Lava Blaze Pro 5G", price: 12499, releaseDate: "November 2023", processor: "MediaTek Dimensity 6020", display: '6.78" FHD+ 120Hz LCD', camera: "50MP Main Camera", battery: "5000 mAh", scores: { cam: 5, perf: 5, bat: 8, disp: 6 } },
      { id: "lav-bn4l", brand: "Lava", name: "Lava Bold N4 Lite", price: 7999, releaseDate: "Upcoming", processor: "UNISOC T606", display: '6.5" HD+ LCD 90Hz', camera: "13MP Main Camera", battery: "5000 mAh", scores: { cam: 3, perf: 4, bat: 8, disp: 4 } },
      { id: "lav-y4", brand: "Lava", name: "Lava Yuva 4", price: 6999, releaseDate: "November 2024", processor: "UNISOC T606", display: '6.56" HD+ LCD 90Hz', camera: "50MP Main Camera", battery: "5000 mAh", scores: { cam: 4, perf: 4, bat: 8, disp: 4 } },

      // ITEL
      { id: "itl-s24", brand: "Itel", name: "Itel S24", price: 9999, releaseDate: "April 2024", processor: "MediaTek Helio G91", display: '6.6" HD+ LCD 90Hz', camera: "108MP Main Camera", battery: "5000 mAh", scores: { cam: 5, perf: 4, bat: 8, disp: 5 } },
      { id: "itl-p55p", brand: "Itel", name: "Itel P55+", price: 9499, releaseDate: "February 2024", processor: "UNISOC T606", display: '6.6" HD+ LCD 90Hz', camera: "50MP Main Camera", battery: "5000 mAh", scores: { cam: 4, perf: 4, bat: 8, disp: 5 } },
      { id: "itl-a70", brand: "Itel", name: "Itel A70", price: 6299, releaseDate: "January 2024", processor: "UNISOC T603", display: '6.6" HD+ LCD 60Hz', camera: "13MP Main Camera", battery: "5000 mAh", scores: { cam: 3, perf: 3, bat: 8, disp: 4 } }
    ];

    // State Management
    let compareList = [];

    // Navigation Switcher
    function switchTab(tabId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));

      event.currentTarget.classList.add('active');
      document.getElementById(`${tabId}-view`).classList.add('active');

      if (tabId === 'catalog') renderCatalog();
      if (tabId === 'compare') renderComparison();
    }

    // Recommendation Algorithm
    function calculateSuitability(phone) {
      const wCam = parseInt(document.getElementById('weight-cam').value);
      const wPerf = parseInt(document.getElementById('weight-perf').value);
      const wBat = parseInt(document.getElementById('weight-bat').value);
      const wDisp = parseInt(document.getElementById('weight-disp').value);

      const totalWeight = wCam + wPerf + wBat + wDisp;
      
      const weightedScore = (
        (phone.scores.cam * wCam) +
        (phone.scores.perf * wPerf) +
        (phone.scores.bat * wBat) +
        (phone.scores.disp * wDisp)
      );

      // Scale to 0-100%
      return Math.round((weightedScore / (totalWeight * 10)) * 100);
    }

    function updateFilters() {
      // Update UI slider readouts
      const budget = parseInt(document.getElementById('budget-slider').value);
      document.getElementById('budget-val').innerText = `₹${budget.toLocaleString('en-IN')}`;
      
      document.getElementById('weight-cam-val').innerText = document.getElementById('weight-cam').value;
      document.getElementById('weight-perf-val').innerText = document.getElementById('weight-perf').value;
      document.getElementById('weight-bat-val').innerText = document.getElementById('weight-bat').value;
      document.getElementById('weight-disp-val').innerText = document.getElementById('weight-disp').value;

      renderRecommendations();
    }

    function resetFilters() {
      document.getElementById('budget-slider').value = 200000;
      document.getElementById('brand-select').value = 'ALL';
      document.getElementById('weight-cam').value = 5;
      document.getElementById('weight-perf').value = 5;
      document.getElementById('weight-bat').value = 5;
      document.getElementById('weight-disp').value = 5;
      updateFilters();
    }

    function renderRecommendations() {
      const budget = parseInt(document.getElementById('budget-slider').value);
      const selectedBrand = document.getElementById('brand-select').value;
      const grid = document.getElementById('recommendations-grid');

      let filtered = phoneDatabase.filter(phone => {
        const matchesBudget = phone.price <= budget;
        const matchesBrand = selectedBrand === 'ALL' || phone.brand === selectedBrand || (selectedBrand === 'Xiaomi' && (phone.brand === 'Xiaomi' || phone.brand === 'Redmi')) || (selectedBrand === 'Nothing' && phone.brand === 'Nothing');
        return matchesBudget && matchesBrand;
      });

      // Sort by suitability score
      filtered.forEach(phone => phone.currentMatch = calculateSuitability(phone));
      filtered.sort((a, b) => b.currentMatch - a.currentMatch);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <i class="fa-solid fa-filter-circle-xmark"></i>
            <h3>No devices match your criteria</h3>
            <p>Try increasing your budget ceiling or resetting brand filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(phone => createPhoneCard(phone, true)).join('');
    }

    function renderCatalog() {
      const search = document.getElementById('search-bar').value.toLowerCase();
      const sortBy = document.getElementById('sort-select').value;
      const grid = document.getElementById('catalog-grid');

      let filtered = phoneDatabase.filter(p => 
        p.name.toLowerCase().includes(search) || 
        p.brand.toLowerCase().includes(search) ||
        p.processor.toLowerCase().includes(search)
      );

      // Apply Sorting
      filtered.forEach(phone => phone.currentMatch = calculateSuitability(phone));

      if (sortBy === 'recommended') {
        filtered.sort((a, b) => b.currentMatch - a.currentMatch);
      } else if (sortBy === 'newest') {
        filtered.sort((a, b) => parseReleaseDate(b.releaseDate) - parseReleaseDate(a.releaseDate));
      } else if (sortBy === 'oldest') {
        filtered.sort((a, b) => parseReleaseDate(a.releaseDate) - parseReleaseDate(b.releaseDate));
      } else if (sortBy === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortBy === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sortBy === 'name-asc') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      }

      grid.innerHTML = filtered.map(phone => createPhoneCard(phone, false)).join('');
    }

    function createPhoneCard(phone, showMatchBadge) {
      const isCompared = compareList.some(item => item.id === phone.id);
      const isUpcoming = phone.releaseDate.includes('Upcoming') || phone.releaseDate.includes('Expected');

      return `
        <div class="phone-card">
          ${showMatchBadge ? `<div class="suitability-badge">${phone.currentMatch}% Match</div>` : ''}
          <div>
            <span class="phone-brand">${phone.brand}</span>
            <h3 class="phone-name">${phone.name}</h3>
            <div class="release-badge ${isUpcoming ? 'upcoming' : ''}">
              <i class="fa-regular fa-calendar"></i> ${phone.releaseDate.includes('Expected') || phone.releaseDate.includes('Upcoming') ? phone.releaseDate : 'Released: ' + phone.releaseDate}
            </div>
            <div class="phone-price">₹${phone.price.toLocaleString('en-IN')}</div>
            <ul class="specs-list">
              <li><i class="fa-solid fa-microchip"></i> ${phone.processor}</li>
              <li><i class="fa-solid fa-mobile-screen"></i> ${phone.display}</li>
              <li><i class="fa-solid fa-camera"></i> ${phone.camera}</li>
              <li><i class="fa-solid fa-battery-full"></i> ${phone.battery}</li>
            </ul>
          </div>
          <div class="card-actions">
            <button class="btn-action ${isCompared ? 'active' : ''}" onclick="toggleCompare('${phone.id}')">
              <i class="fa-solid ${isCompared ? 'fa-check' : 'fa-plus'}"></i> ${isCompared ? 'Added' : 'Compare'}
            </button>
          </div>
        </div>
      `;
    }

    function toggleCompare(phoneId) {
      const index = compareList.findIndex(p => p.id === phoneId);
      if (index > -1) {
        compareList.splice(index, 1);
      } else {
        if (compareList.length >= 4) {
          alert("You can compare up to 4 smartphones simultaneously.");
          return;
        }
        const phone = phoneDatabase.find(p => p.id === phoneId);
        if (phone) compareList.push(phone);
      }

      document.getElementById('compare-count').innerText = compareList.length;
      
      // Re-render current visible section
      if (document.getElementById('recommendations-view').classList.contains('active')) renderRecommendations();
      if (document.getElementById('catalog-view').classList.contains('active')) renderCatalog();
      if (document.getElementById('compare-view').classList.contains('active')) renderComparison();
    }

    function renderComparison() {
      const container = document.getElementById('compare-content');

      if (compareList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-scale-unbalanced-flip"></i>
            <h3>No Phones Selected for Comparison</h3>
            <p>Browse the catalog or recommendations engine and click "+ Compare" to add up to 4 devices.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="comparison-container">
          <table class="comparison-table">
            <thead>
              <tr>
                <th>Specification</th>
                ${compareList.map(p => `
                  <th>
                    <div style="font-weight:700; font-size:1.1rem; color:var(--text-main);">${p.name}</div>
                    <div style="color:var(--accent); font-size:0.95rem;">₹${p.price.toLocaleString('en-IN')}</div>
                    <button class="btn-action" style="margin-top:0.5rem; padding:0.25rem 0.5rem; font-size:0.75rem;" onclick="toggleCompare('${p.id}')">Remove</button>
                  </th>
                `).join('')}
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Brand</td>
                ${compareList.map(p => `<td>${p.brand}</td>`).join('')}
              </tr>
              <tr>
                <td>Release Date</td>
                ${compareList.map(p => `<td>${p.releaseDate}</td>`).join('')}
              </tr>
              <tr>
                <td>Processor</td>
                ${compareList.map(p => `<td>${p.processor}</td>`).join('')}
              </tr>
              <tr>
                <td>Display</td>
                ${compareList.map(p => `<td>${p.display}</td>`).join('')}
              </tr>
              <tr>
                <td>Camera Setup</td>
                ${compareList.map(p => `<td>${p.camera}</td>`).join('')}
              </tr>
              <tr>
                <td>Battery Capacity</td>
                ${compareList.map(p => `<td>${p.battery}</td>`).join('')}
              </tr>
              <tr>
                <td>Camera Score</td>
                ${compareList.map(p => `<td>${p.scores.cam}/10</td>`).join('')}
              </tr>
              <tr>
                <td>Performance Score</td>
                ${compareList.map(p => `<td>${p.scores.perf}/10</td>`).join('')}
              </tr>
              <tr>
                <td>Battery Score</td>
                ${compareList.map(p => `<td>${p.scores.bat}/10</td>`).join('')}
              </tr>
              <tr>
                <td>Display Score</td>
                ${compareList.map(p => `<td>${p.scores.disp}/10</td>`).join('')}
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    // Initial Execution
    updateFilters();
  </script>
</body>
</html>
